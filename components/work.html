{{define "work"}}
<div class="projects-grid">
{{range .MyWorks}}
    <article class="project-card">
        <div class="project-image">
            <div class="image-placeholder"><span class="placeholder-index">PROJECT / VISUAL</span><span class="placeholder-name">{{.Title}}</span><span class="placeholder-hint">ADD YOUR SCREENSHOT</span></div>
            <img src="{{.Image}}" alt="{{.Title}} screenshot" loading="lazy" onerror="this.style.display='none'">
            <span class="project-period">{{.Period}}</span>
        </div>
        <div class="project-content">
            <div class="project-type">{{.Type}}</div>
            <h3>{{.Title}}</h3>
            <p class="project-description">{{.Description}}</p>
            <div class="project-impact"><span>IMPACT</span><p>{{.Impact}}</p></div>
            <div class="project-details"><div><span>STACK</span><p>{{.Stack}}</p></div><div><span>ROLE</span><p>{{.Role}}</p></div></div>
        </div>
    </article>
{{end}}
</div>
{{end}}
